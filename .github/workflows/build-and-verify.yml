# Build and verify — runs on every push and pull request.
#
# Four checks run on GitHub before a broken post or a broken editor can reach
# the live site:
#
#   1. build          — does Astro accept every markdown file?
#   2. check:desk     — does the writing desk still render markdown, round-trip
#                       frontmatter and ship a page that is noindex?
#   3. check:desk:ui  — can you still unlock, write, publish, draft, rename and
#                       recover a post? (a whole session, driven through a DOM)
#   4. check:links    — does every local link, font path and asset in the output resolve?
#
# 2 and 3 are what stop /write/ from quietly breaking: the desk has no server, so
# nothing else would notice if it stopped writing files the site can build.

name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify the writing desk and links
        run: npm run verify

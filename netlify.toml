# Netlify build settings — kept only while the old Netlify deploy is still
# live. The site's home is GitHub Pages (see DEPLOYMENT.md); once you have
# stopped builds in the Netlify dashboard ("Stop Netlify builds" below), this
# file can be deleted.
#
#   Netlify dashboard → your site → Site configuration → Build & deploy →
#   Continuous builds → Stop builds
#
# Stopping matters: while builds are on, every merge to main also runs a
# Netlify production deploy, and production deploys cost credits.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.12+. Netlify honours this; Cloudflare Pages reads
  # NODE_VERSION from the dashboard's environment variables instead.
  NODE_VERSION = "22.12.0"

  # You do NOT need to set your site URL here: Netlify passes its own `URL`
  # variable into every build and astro.config.mjs picks it up, so the RSS feed,
  # sitemap and canonical tags are correct from the first deploy.
  #
  # Set SITE_URL only to force a different address — e.g. a custom domain before
  # its DNS has moved over. It overrides everything else.
  #
  # SITE_URL = "https://yourdomain.com"

# The private writing desk at /write/ stays out of search results. Both the
# bare path and anything under it, so the header applies whichever way the host
# resolves the directory index.
[[headers]]
  for = "/write"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/write/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Fonts never change — let the CDN keep them forever.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
